# The deployed stack. One EC2 instance in ap-southeast-2 runs all of this, the two
# Next.js sites and nantex's static page included; Temporal and LiveKit are managed.
#
# Deploys pull images CI built (ghcr.io, tagged with the commit) and never build here: a
# Next.js build beside the running stack does not fit in 4 GB. First boot has no tag yet,
# so infra/user_data.sh builds from source once. Every limit below is a ceiling, so one
# leaking service is killed and restarted instead of taking the box down with it.
# Sized at about 1.5x each container's peak over 25 days on the 8 GB box.

name: nandex

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # nantex's static page; .github/workflows/nantex-site.yml keeps it current.
      - /opt/nandex/nantex:/srv/nantex:ro
    environment:
      # <public-ip>.nip.io, written by user_data. Caddy gets a Let's Encrypt
      # certificate for it.
      APP_HOST: ${APP_HOST}
      # Each site's hostnames, set in /opt/nandex/.env once its DNS points here. Until
      # then the default is a plain-HTTP localhost name, so Caddy never asks Let's
      # Encrypt for a name that still resolves to Netlify and trips its failure limit.
      PORTFOLIO_SITE: ${PORTFOLIO_SITE:-http://porto.localhost}
      FRONTEND_SITE: ${FRONTEND_SITE:-http://autointerviewer.localhost}
      NANTEX_SITE: ${NANTEX_SITE:-http://nantex.localhost}
    depends_on:
      - core
      - frontend
      - portfolio

  # AutoInterviewer. /api/* is rewritten to core inside the compose network.
  frontend:
    image: ghcr.io/nandishnaik01/nandex-frontend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: frontend
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - core

  portfolio:
    image: ghcr.io/nandishnaik01/nandex-portfolio:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: portfolio
        NEXT_PUBLIC_BOOKING_URL: ${NEXT_PUBLIC_BOOKING_URL:-}
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - core

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${DB_NAME:-ragdb}
      POSTGRES_USER: ${DB_USER:-ragdb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 20

  core:
    image: ghcr.io/nandishnaik01/nandex-core:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    restart: unless-stopped
    mem_limit: 1536m
    env_file: /opt/nandex/.env
    environment:
      PORT: "8000"
      DB_HOST: postgres
      DJANGO_DEBUG: "false"
      # tps reaches itself over loopback inside this container; nothing external does.
      CORE_TPS_GRPC_ADDRESS: localhost:50051
      CORE_RUNNER_BASE_URL: http://runner:8002
      # The agent service below always runs, so the portfolio's voice has a worker to
      # dispatch.
      PORTFOLIO_VOICE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: ghcr.io/nandishnaik01/nandex-worker:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    mem_limit: 384m
    env_file: /opt/nandex/.env
    environment:
      DB_HOST: postgres
      DJANGO_DEBUG: "false"
      CORE_RUNNER_BASE_URL: http://runner:8002
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    image: ghcr.io/nandishnaik01/nandex-agent:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    restart: unless-stopped
    mem_limit: 1280m
    env_file: /opt/nandex/.env
    environment:
      # Reaches core inside the compose network rather than back out through Caddy.
      INTERVIEW_CORE_BASE_URL: http://core:8000
    depends_on:
      - core

  # The only container with the Docker socket. It starts one throwaway container per
  # submission, which is why it exists and why it is never published: anything that
  # reaches it with its bearer token can start containers on this host.
  runner:
    image: ghcr.io/nandishnaik01/nandex-runner:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runner
    restart: unless-stopped
    mem_limit: 192m
    env_file: /opt/nandex/.env
    environment:
      PORT: "8002"
      # Two at once on a 4 GB box; a third is refused with 429 rather than queued.
      RUNNER_MAX_CONCURRENT_RUNS: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  caddy_data:
  caddy_config:
